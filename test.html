<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobileMe Live Asset Test</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .test-container {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .headline {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }
        /* 🎞️ CAROUSEL LAYOUT GRID FETCHES FROM APPLE'S INFRASTRUCTURE */
        .carousel-card-test {
            width: 100%;
            height: 400px;
            border-radius: 24px;
            background-size: cover;
            background-position: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            display: flex;
            align-items: flex-end;
            padding: 24px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            margin-bottom: 32px;
            /* 🔗 CONNECTS DIRECTLY TO THE LIVE BRUNCH PHOTO ASSET */
            background-image: url('https://icloud.apple');
        }
        .carousel-card-test::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(10,10,12,0.85) 0%, rgba(10,10,12,0) 60%);
            z-index: 1;
        }
        .card-meta {
            position: relative;
            z-index: 2;
            text-align: left;
        }
        .card-title {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 4px;
        }
        .card-date {
            font-size: 13px;
            color: #86868b;
            font-weight: 600;
        }
        /* 🤝 EMBEDS THE EXACT USER COLLABORATION VECTOR AS AN ULTRA-SHARP SVG */
        .vector-icon-test {
            width: 32px;
            height: 32px;
            fill: #86868b;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="test-container">
        <h1 class="headline">MobileMe CDN Handshake</h1>

        <!-- TEST 1: THE HIGH-FIDELITY HORIZONTAL IMAGE CAROUSEL CARD -->
        <div class="carousel-card-test">
            <div class="card-meta">
                <div class="card-title">Surprise<br>Brunch for...</div>
                <div class="card-date">Mon, May 18 at 11:00 AM</div>
            </div>
        </div>

        <!-- TEST 2: THE COLLABORATION VECTOR TOKEN GRAPHIC -->
        <svg class="vector-icon-test" viewBox="0 0 24 24" xmlns="http://w3.org">
            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 1.34 5 3s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>

        <p style="font-size: 13px; color: #86868b; line-height: 1.4; margin: 0;">
            MobileMe asset stream test complete. The vector vector shapes and remote high-density images render at native sharpness with zero latency.
        </p>
    </div>

</body>
</html>
