    <script>
        // ==================================================
        // ==================================================
        // ====
        // EMMANUEL'S MASTER DOWNLOAD LINK STORAGE
        // When you upload a new APK, just delete "COMING_SOON" and paste your link!
        //
        // ==================================================
        // ==================================================
        // ====
        const downloadDatabase = {
            "calculator": "https://drive.google.com/file/d/16slk1OvSKIJd-JuCZjMPIBzIiPeQ22AG/view?usp=drivesdk",
            "clock": "COMING_SOON",
            "notes": "COMING_SOON",
            "settings": "COMING_SOON",
            "compass": "COMING_SOON",
            "weather": "COMING_SOON",
            "files": "COMING_SOON",
            "reminders": "COMING_SOON",
            "voicememos": "COMING_SOON",
            "calendar": "COMING_SOON",
            "statusbar": "COMING_SOON",
            "siri": "COMING_SOON",
            "camera": "COMING_SOON",
            "dynamicisland": "COMING_SOON"
        };

        function processDownload() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const appKey = urlParams.get('app');

                if (!appKey || !downloadDatabase.hasOwnProperty(appKey)) {
                    window.location.href = "index.html";
                    return;
                }

                const targetLink = downloadDatabase[appKey];

                if (targetLink === "COMING_SOON") {
                    setTimeout(() => {
                        document.getElementById('statusHeading').innerText = "Coming Soon";
                        document.getElementById('statusHeading').style.color = "var(--ios-orange)";
                        document.getElementById('statusDetails').innerText = "Emmanuel is currently coding and compiling this APK package from scratch. Returning Home...";
                        
                        setTimeout(() => {
                            window.location.href = "index.html";
                        }, 3000);
                    }, 1000);
                } else {
                    setTimeout(() => {
                        document.getElementById('statusHeading').innerText = "Downloading...";
                        document.getElementById('statusDetails').innerText = "Your secure binary download has initialized successfully. Check your browser folder.";

                        // FIX: Spawns a silent transient window to force Google Drive's download handler
                        const downloadWindow = window.open(targetLink, '_blank');
                        
                        // Safely closes the window context if the platform permits it
                        if (downloadWindow) {
                            setTimeout(() => { downloadWindow.close(); }, 500);
                        }

                        // Perfect routing loop back to your main app interface
                        setTimeout(() => {
                            window.location.href = "index.html";
                        }, 3000);
                    }, 1500);
                }
            } catch (err) {
                window.location.href = "index.html";
            }
        }

        window.onload = processDownload;
    </script>
