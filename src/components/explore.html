<!-- ⚡ EXPLORE CORE: BALANCED INLINE VIEWPORT SCENE SWITCHER -->
<div class="explore-pill-box" style="margin-top: 24px; text-align: center;">
    <!-- 
      ⚡ SELF-CONTAINED INLINE HANDSHAKE LOOP
      This button houses the entire post-landing store skeleton structure and navigation switching script 
      directly inside its own native properties, forcing an instant transition on click!
    -->
    <button id="explore-trigger-pill" 
            onclick="(function(){
                // 1. LOCATE SYSTEM STAGING VIEWPORT ARCHITECTURES
                const landing = document.getElementById('landing-scene-container');
                const dashboard = document.getElementById('store-dashboard-view');
                const template = document.getElementById('devstore-main-screen-blueprint');
                
                if (landing && dashboard && template) {
                    // 2. TRIGGER INSTANT VISIBILITY SWAP ON THE PITCH-BLACK CANVAS
                    landing.style.display = 'none';
                    dashboard.style.display = 'flex';
                    window.scrollTo(0, 0);
                    
                    // 3. MOUNT THE POST-LANDING MAIN ECOSYSTEM SKELETON
                    dashboard.innerHTML = '';
                    dashboard.appendChild(template.content.cloneNode(true));
                    
                    // 4. WIRE UP HAMBURGER DRAWER INTERACTION LOOPS IMMEDIATELY POST-MOUNT
                    const trigger = document.getElementById('menu-drawer-trigger-btn');
                    const drawer = document.getElementById('left-sidebar-menu-drawer');
                    const closeBtn = document.getElementById('close-drawer-btn');
                    
                    if (trigger && drawer && closeBtn) {
                        trigger.addEventListener('click', (e) => { e.stopPropagation(); drawer.style.left = '0px'; });
                        closeBtn.addEventListener('click', () => { drawer.style.left = '-280px'; });
                        document.addEventListener('click', (e) => { if (!drawer.contains(e.target) && e.target !== trigger) drawer.style.left = '-280px'; });
                    }
                    console.log('🪐 AndroidDevStore Engine: MainScreen skeleton rendered live successfully via inline properties!');
                } else {
                    console.error('⚠️ Critical target elements missing from index shell.');
                }
            })()" 
            class="interactive-scale-feedback" 
            style="background-color: #ffffff; color: #000000; font-size: 16px; font-weight: 600; padding: 12px 40px; border-radius: 24px; border: none; cursor: pointer; outline: none; box-shadow: 0 4px 14px rgba(255,255,255,0.15); display: inline-block;">
        Explore
    </button>
</div>
