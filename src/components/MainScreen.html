<!-- COMPONENT MOUNT ATTACHMENT ACTION HANDLERS -->
<script>
    (function() {
        const trigger = document.getElementById('menu-drawer-trigger-btn');
        const drawer = document.getElementById('left-sidebar-menu-drawer');
        const closeBtn = document.getElementById('close-drawer-btn');

        if (trigger && drawer && closeBtn) {
            // Open Left Drawer Menu
            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                drawer.style.left = '0px';
            });

            // Close Left Drawer Menu via X button
            closeBtn.addEventListener('click', () => {
                drawer.style.left = '-280px';
            });

            // Auto-hide drawer layout if user clicks anywhere on the dark canvas body fields
            document.addEventListener('click', (e) => {
                if (!drawer.contains(e.target) && e.target !== trigger) {
                    drawer.style.left = '-280px';
                }
            });
        }
    })();
</script>
