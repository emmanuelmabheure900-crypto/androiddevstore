<script>
    // EMMANUEL'S MASTER DOWNLOAD LINK STORAGE WITH DIRECT DOWNLOAD FIX
    const downloadDatabase = {
        "calculator": "https://google.com",
        "clock": "COMING_SOON",
        "notes": "COMING_SOON",
        "settings": "COMING_SOON",
        "compass": "COMING_SOON",
        "weather": "COMING_SOON",
        "files": "COMING_SOON",
        "reminders": "COMING_SOON",
        "voicememos": "COMING_SOON",
        "calendar": "COMING_SOON",
        "statusbar": "COMING_SOON",
        "siri": "COMING_SOON",
        "camera": "COMING_SOON",
        "dynamicisland": "COMING_SOON"
    };

    function processDownload() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const appKey = urlParams.get('app');

            if (!appKey || !downloadDatabase.hasOwnProperty(appKey)) {
                window.location.href = "index.html";
                return;
            }

            const targetLink = downloadDatabase[appKey];

            // Safely fetch your UI elements if they exist
            const headingEl = document.getElementById('statusHeading');
            const detailsEl = document.getElementById('statusDetails');

            if (targetLink === "COMING_SOON") {
                setTimeout(() => {
                    // Only updates UI text if the IDs exist in your HTML
                    if (headingEl) {
                        headingEl.innerText = "Coming Soon";
                        headingEl.style.color = "var(--ios-orange)";
                    }
                    if (detailsEl) {
                        detailsEl.innerText = "Emmanuel is currently coding and compiling this application.";
                    }
                    
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2000);
                }, 1500);
            } else {
                setTimeout(() => {
                    // Only updates UI text if the IDs exist in your HTML
                    if (headingEl) headingEl.innerText = "Downloading...";
                    if (detailsEl) detailsEl.innerText = "Your secure binary download has initialized successfully.";

                    // Silent background download anchor so the user is never moved out of the web
                    const silentDownloader = document.createElement('a');
                    silentDownloader.href = targetLink;
                    silentDownloader.setAttribute('download', `${appKey}.apk`); 
                    silentDownloader.style.display = 'none';
                    
                    document.body.appendChild(silentDownloader);
                    silentDownloader.click();
                    document.body.removeChild(silentDownloader);

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 3000);

                }, 1500);
            }
        } catch (err) {
            window.location.href = "index.html";
        }
    }

    // Wait until everything is fully loaded before executing
    window.addEventListener('DOMContentLoaded', processDownload);
</script>
