<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AndroidDevStore - Storefront Console</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000 !important;
            color: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow-x: hidden; width: 100%; display: flex; flex-direction: column; align-items: center;
        }
        /* 🏛️ ULTRA-GLASS NAVIGATION HEADER */
        .store-nav-bar {
            width: 100%; height: 44px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(10, 10, 12, 0.01) !important; backdrop-filter: blur(50px) saturate(240%);
            -webkit-backdrop-filter: blur(50px) saturate(240%); border-bottom: 0.5px solid rgba(255, 255, 255, 0.02);
            padding: 0 16px; position: fixed; top: 0; left: 0; z-index: 9998;
        }
        .brand-font-center { font-weight: 700; font-size: 16px; letter-spacing: -0.3px; position: absolute; left: 50%; transform: translateX(-50%); }
        .brand-white { color: #ffffff; }
        .brand-orange { color: #ff9f0a; }

        /* 👥 SLIDING LEFT NAVIGATION DRAWER */
        #left-sidebar-menu-drawer {
            position: fixed; top: 0; left: -280px; width: 260px; height: 100vh;
            background: rgba(19, 19, 21, 0.97); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border-right: 0.5px solid rgba(255, 255, 255, 0.08); z-index: 9999;
            box-shadow: 10px 0 30px rgba(0,0,0,0.6); display: flex; flex-direction: column;
            padding: 60px 20px 24px 20px; transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .menu-link { color: #ffffff; font-size: 17px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
        
        .interactive-scale-feedback { transition: transform 0.1s ease; }
        .interactive-scale-feedback:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="store-nav-bar">
        <!-- TWO-LINE HAMBURGER MENU BUTTON -->
        <button id="menu-drawer-trigger-btn" class="interactive-scale-feedback" style="background: none; border: none; color: #ffffff; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 4px; outline: none; width: 24px;">
            <div style="width: 20px; height: 2px; background-color: #ffffff; border-radius: 1px;"></div>
            <div style="width: 14px; height: 2px; background-color: #ffffff; border-radius: 1px;"></div>
        </button>
        <div class="brand-font-center"><span class="brand-white">Android</span><span class="brand-orange">DevStore</span></div>
        <div style="width: 24px; height: 24px;"></div>
    </div>

    <div id="left-sidebar-menu-drawer">
        <button id="close-drawer-btn" style="position: absolute; top: 12px; right: 16px; background: none; border: none; color: #86868b; font-size: 20px; cursor: pointer; outline: none;">✕</button>
        <div class="menu-link">📱 Today</div>
        <div class="menu-link">🚀 Games</div>
        <div class="menu-link" style="color: #007aff;">📦 Apps</div>
        <div class="menu-link">⚙️ Settings</div>
    </div>

    <!-- MAIN DISPLAY SCROLL PANEL CHASSIS -->
    <div style="width: 100%; max-width: 360px; padding: 60px 16px 40px 16px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;">
        
        <!-- 🎥 VIDEO SPOTLIGHT PLAYER -->
        <div style="width: 100%; height: 200px; border-radius: 20px; overflow: hidden; margin-bottom: 24px; background: #1c1c1e; box-shadow: 0 12px 32px rgba(0,0,0,0.5);">
            <video src="./src/assets/video.mp4" autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover; display: block;"></video>
        </div>

        <!-- SEARCH INPUT -->
        <div style="width: 100%; margin-bottom: 24px;">
            <input type="text" placeholder="🔍 Search Apps, Tiers, Developers" style="width: 100%; height: 38px; background: #1c1c1e; border: none; border-radius: 10px; padding: 0 12px 0 16px; color: #ffffff; font-size: 14px; outline: none;">
        </div>

        <!-- SKELETON APP CARD -->
        <div class="interactive-scale-feedback" style="background: rgba(255, 255, 255, 0.02); border: 0.5px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(30px); border-radius: 16px; padding: 14px; display: flex; align-items: center; justify-content: space-between; width: 100%; cursor: pointer;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 44px; height: 44px; background: linear-gradient(135deg, #1e1e24 0%, #4a154b 100%); border-radius: 10px;"></div>
                <div style="text-align: left;">
                    <div style="font-size: 15px; font-weight: 700; color: #ffffff;">System Performance Engine</div>
                    <div style="font-size: 11px; color: #86868b; margin-top: 2px;">Normal Users Suite &bull; By Emmanuel Mabheure</div>
                </div>
            </div>
            <button style="background: #2c2c2e; color: #007aff; border: none; padding: 6px 18px; border-radius: 14px; font-size: 12px; font-weight: 700; cursor: pointer; outline: none;">VIEW</button>
        </div>
    </div>

    <script>
        const trigger = document.getElementById('menu-drawer-trigger-btn');
        const drawer = document.getElementById('left-sidebar-menu-drawer');
        const closeBtn = document.getElementById('close-drawer-btn');

        if (trigger && drawer && closeBtn) {
            trigger.addEventListener('click', (e) => { e.stopPropagation(); drawer.style.left = '0px'; });
            closeBtn.addEventListener('click', () => { drawer.style.left = '-280px'; });
            document.addEventListener('click', (e) => { if (!drawer.contains(e.target) && e.target !== trigger) drawer.style.left = '-280px'; });
        }
    </script>
</body>
</html>
