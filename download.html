<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #ff9100;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <h2 id="statusHeading">Connecting...</h2>
    <p id="statusDetails">Preparing secure handshake connection down-link to server grid.</p>

    <script>
        const downloadDatabase = {
            "calculator": "https://google.com",
            "clock": "COMING_SOON",
            "notes": "COMING_SOON",
            "settings": "COMING_SOON",
            "weather": "COMING_SOON",
            "compass": "COMING_SOON",
            "files": "COMING_SOON",
            "reminders": "COMING_SOON",
            "voicememos": "COMING_SOON",
            "calendar": "COMING_SOON",
            "statusbar": "COMING_SOON",
            "siri": "COMING_SOON",
            "camera": "COMING_SOON",
            "dynamicsisland": "COMING_SOON"
        };

        function processDownload() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const appKey = urlParams.get('app');

                if (!appKey || !downloadDatabase.hasOwnProperty(appKey)) {
                    window.location.href = "index.html";
                    return;
                }

                const targetLink = downloadDatabase[appKey];

                if (targetLink === "COMING_SOON") {
                    setTimeout(() => {
                        document.getElementById('statusHeading').innerText = "Coming Soon";
                        document.getElementById('statusHeading').style.color = "#ff9100";
                        document.getElementById('statusDetails').innerText = "Emmanuel is currently coding and compiling this APK package.";
                    }, 500);

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 3500);
                } else {
                    // Update layout status immediately while remaining on screen
                    setTimeout(() => {
                        document.getElementById('statusHeading').innerText = "Downloading...";
                        document.getElementById('statusDetails').innerText = "Your secure binary download has initialized successfully.";
                    }, 500);

                    // FIXED ENGINE: Triggers the download silently in the background
                    const silentDownloader = document.createElement('a');
                    silentDownloader.href = targetLink;
                    silentDownloader.setAttribute('download', '');
                    document.body.appendChild(silentDownloader);
                    silentDownloader.click();
                    document.body.removeChild(silentDownloader);

                    // Cleanly returns home after the browser catches the download stream
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 3000); 
                }
            } catch (err) {
                window.location.href = "index.html";
            }
        }

        window.onload = processDownload;
    </script>
</body>
</html>
